# claims — Protocolo de Concurrencia (Regla 9)

# Archivos de ALTO RIESGO (requieren aprobación Chef ANTES de claim):
#   - Configuración global (next.config, alembic.ini, vite/ts configs)
#   - backend/app/schemas/** y frontend/src/types/** (types compartidos)
#   - Layouts/componentes compartidos del frontend
#   - Archivos de entrada principal (main.py, app/)

claims: {}

historial:
  - archivos: "backend/app/models/**, backend/app/schemas/**, frontend/src/types/**, docs/**, backend/alembic/**, backend/scripts/"
    agente: "arq"
    tarea: "ARQ-T1 + ARQ-T2"
    nivel: "ALTO_RIESGO (aprobado por Chef)"
    estado: "LIBERADO"

ultima_actualizacion: "2026-08-13T00:00:00Z"
