# Configuración de Alembic (ARQ-T1)
# Uso:  cd backend && DATABASE_URL=postgresql+psycopg2://... alembic upgrade head

[alembic]
script_location = alembic
prepend_sys_path = .
# La URL real se toma de la variable de entorno DATABASE_URL;
# este valor es solo un placeholder de respaldo.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
